<!-- Menu lateral  -->
<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menú</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-list>
      <ion-item>
        <ion-label>Home</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Catálogo</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Mis Pedidos</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<!-- Page Inicio -->
<div class="ion-page" id="main-content">
  <!-- Header -->
  <app-header title="Tamsa Boutique" brand showMenu showOrders />
  <!-- Contenido -->
  <ion-content class="ion-padding">
    <main class="tienda">
      <section class="hero">
        <h1>Nueva colección</h1>
        <ion-button routerLink="/catalogo">Ver prendas</ion-button>
      </section>

      <section class="recuadro aviso-live">
        <strong>Próximo live</strong>
        <p>Domingo 13 de Diciembre · 20:00 hrs</p>
      </section>

      <div class="fila">
        <h2>Productos destacados</h2>
        <a routerLink="/catalogo">Ver todo ›</a>
      </div>

      <div class="grilla-prendas">
        @for (producto of destacados; track producto.id) {
        <a [routerLink]="['/catalogo', producto.id]">
          <div class="foto-prenda" [style.background-image]="foto(producto)"></div>
          <span>{{ producto.nombre }}</span>
          <strong>{{ clp(producto.precio) }}</strong>
        </a>
        }
      </div>
    </main>
  </ion-content>
</div>
